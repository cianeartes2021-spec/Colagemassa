name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            cmake libffi-dev libssl-dev build-essential \
            lib32stdc++6 lib32z1 libc6-dev-i386
      - name: Instalar Buildozer
        run: pip install --upgrade buildozer cython==0.29.36
      - name: Compilar APK
        run: yes | buildozer -v android debug
      - name: Enviar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: colagem-inteligente-apk
          path: bin/*.apk
