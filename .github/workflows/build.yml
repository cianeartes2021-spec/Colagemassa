name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar APK
        run: |
          yes | buildozer -v android debug
      - name: Enviar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: colagem-inteligente-apk
          path: bin/*.apk
